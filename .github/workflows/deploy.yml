name: Deploy Laravel App

# Deploy otomatis DIMATIKAN atas keputusan Project Owner (24 Agustus 2026).
#
# Koneksi SSH dari GitHub Actions ke Hostinger berulang kali gagal dengan
# "dial tcp: i/o timeout", sehingga merge ke main kadang tidak benar-benar
# sampai ke server tanpa ada yang menyadarinya. Auto-deploy bawaan Hostinger
# juga dimatikan.
#
# Sebagai gantinya, deploy dilakukan manual lewat SSH. Workflow ini
# dipertahankan dan masih bisa dijalankan sewaktu-waktu dari tab Actions
# (Run workflow), tapi tidak lagi terpicu otomatis oleh push.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server via SSH
        # Dikunci ke commit rilis v1.2.5 supaya cabang master milik orang lain tidak bisa mengubah apa yang menerima kunci SSH (audit pra-rilis, WF-01).
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          port: ${{ secrets.PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Pindah ke direktori project di hosting (Path harus diset di GitHub Secrets)
            cd ${{ secrets.PROJECT_PATH }}
            
            # Ambil kode terbaru dari GitHub
            git pull origin main
            
            # Install package PHP terbaru
            composer install --no-interaction --prefer-dist --optimize-autoloader
            
            # Update database
            php artisan migrate --force
            
            # Bersihkan dan refresh cache aplikasi
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            
            # Jika hosting Anda mensupport NodeJS dan Anda punya custom aset UI:
            # npm ci
            # npm run build
